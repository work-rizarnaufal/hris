name: Deploy Staging to Homeserver

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-staging-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Sinkronkan /mnt/data/hris-web dengan origin/master
        run: /home/zarhome/hris/sync-master.sh
